{% extends "base.html" %}

{% block title %}Login — SecureBank{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5">

    <!-- ============================================================
         Login card
         ============================================================ -->
    <div class="card shadow-sm border-0 mt-3">

      <!-- Card header -->
      <div class="card-header bg-primary text-white text-center py-3">
        <h4 class="mb-0 fw-semibold">
          <i class="bi bi-shield-lock me-2"></i>Customer Login
        </h4>
      </div>

      <!-- Card body -->
      <div class="card-body p-4">
        <p class="text-muted text-center mb-4" style="font-size:0.9rem;">
          Enter your credentials to access your account.
        </p>

        <form
          action="{{ url_for('login_post') }}"
          method="POST"
          novalidate
          id="loginForm"
        >
          <!-- Username -->
          <div class="mb-3">
            <label for="username" class="form-label fw-medium">
              <i class="bi bi-person me-1"></i>Username
            </label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              placeholder="Enter your username"
              required
              autocomplete="username"
              autofocus
            />
          </div>

          <!-- Password -->
          <div class="mb-4">
            <label for="password" class="form-label fw-medium">
              <i class="bi bi-lock me-1"></i>Password
            </label>
            <div class="input-group">
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              />
              <!-- Toggle password visibility -->
              <button
                class="btn btn-outline-secondary"
                type="button"
                id="togglePassword"
                title="Show/hide password"
                aria-label="Toggle password visibility"
              >
                <i class="bi bi-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <!-- Submit -->
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-box-arrow-in-right me-1"></i>Login
            </button>
          </div>
        </form>
      </div><!-- /card-body -->

      <!-- Card footer -->
      <div class="card-footer text-center text-muted py-2" style="font-size:0.8rem;">
        Demo credentials &mdash; Username: <strong>demo</strong> &nbsp;|&nbsp;
        Password: <strong>password123</strong>
      </div>

    </div><!-- /card -->
  </div><!-- /col -->
</div><!-- /row -->
{% endblock %}
