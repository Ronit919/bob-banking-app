{% extends "base.html" %}

<div class="row justify-content-center">

      <i class="bi bi-exclamation-octagon display-1 text-danger mb-3"></i>
      <h2 class="fw-bold">500 — Internal Server Error</h2>

  </div>
</div>
{% endblock %}
